<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- BOOTSTRAP CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- BOOTSTRAP ICONS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <!-- CSS NEOPLASTICISMO -->
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>

        <!-- HEADER -->
        <header id="top" class="header-principal">
            <div class="container-fluid">
                <div class="row align-items-center">
                    
                    <!-- LOGO -->
                    <div class="col-2">
                        <a href="../sitio/index.html">
                            <img src="../img/a-img-icono-logo2.png" alt="Logo Neoplasticismo" class="logo-img">
                        </a>
                    </div>
                    
                    <!-- BARRA DE BÚSQUEDA -->
                    <div class="col-6">
                        <div class="input-group buscador">
                            <span class="input-group-text buscador-icono">
                                <img src="../img/a-img-icono-buscar.png" alt="Buscar" class="icono-lupa">
                            </span>
                            <input type="text" class="form-control buscador-input" placeholder="Buscar...">
                        </div>
                    </div>
                    
                    <!-- ICONOS NAVEGACIÓN -->
                    <div class="col-4 d-flex justify-content-end align-items-center gap-3">
                        <a href="../subpaginas/contextohistorico.html">
                            <img src="../img/a-img-icono-contextohistorico.png" alt="Contexto Histórico" class="icono-nav">
                        </a>
                        <a href="../subpaginas/destijl.html">
                            <img src="../img/a-img-icono-destijl.png" alt="De Stijl" class="icono-nav">
                        </a>
                        <a href="../subpaginas/autores.html">
                            <img src="../img/a-img-icono-autores.png" alt="Autores" class="icono-nav">
                        </a>
                        <a href="../subpaginas/obras.html">
                            <img src="../img/a-img-icono-obras.png" alt="Obras" class="icono-nav">
                        </a>
                        <a href="../subpaginas/foroypublicaciones.html">
                            <img src="../img/a-img-icono-foropublicaciones.png" alt="Foro y Publicaciones" class="icono-nav">
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- NAVBAR / sin registro de usuario-->
        <nav class="navbar-principal">
            <div class="container-fluid p-0">
                <div class="row g-0">
                    <div class="col-auto navbar-bloque-izquierda">
                        <span class="navbar-titulo">NEOPLASTICISMO</span>
                        <div class="navbar-bloques-color">
                            <div class="navbar-bloque-azul"></div>
                            <div class="navbar-bloque-rojo"></div>
                        </div>
                    </div>
                    <div class="col navbar-bloque-blanco"></div>
                    <div class="col-auto navbar-bloque-amarillo"></div>
                </div>
            </div>
        </nav>

        <!-- HERO -->
        <section class="hero">
            <div class="container-fluid p-0">
                <div class="row g-0">

                    <!-- IZQUIERDA: TEXTO -->
                    <div class="col-7 hero-texto">
                        <h2 class="hero-titulo">obras</h2>
                        <p class="obras-seccion-desc">Explorá las obras del Neoplasticismo. Hacé clic en los <span class="obras-hint-plus">+</span> para descubrir cada pieza.</p>
                    </div>

                    <!-- DERECHA: CARRUSEL -->
                    <div class="col-5 p-0">
                        <div id="carruselHero" class="carousel slide hero-carrusel" data-bs-ride="carousel" data-bs-interval="3000">

                            <!-- IMÁGENES -->
                            <div class="carousel-inner">
                                <div class="carousel-item active">
                                    <img src="../img/5-obras.pintura-mondrian-03.png" class="hero-img" alt="Mondrian 03">
                                </div>
                                <div class="carousel-item">
                                    <img src="../img/5-obras.arquitectura-rietveldhouseschroderhuis-01.jpg" class="hero-img" alt="Casa Rietveld">
                                </div>
                                <div class="carousel-item">
                                    <img src="../img/5-obras.pintura-mondrian-02.jpg" class="hero-img" alt="Mondrian 02">
                                </div>
                                <div class="carousel-item">
                                    <img src="../img/5-obras.disenoindustrial-sillarietveld.webp" class="hero-img" alt="Silla Rietveld">
                                </div>
                            </div>

                            <!-- FLECHAS -->
                            <button class="carousel-control-prev" type="button" data-bs-target="#carruselHero" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Anterior</span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#carruselHero" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Siguiente</span>
                            </button>

                            <!-- DOTS -->
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carruselHero" data-bs-slide-to="0" class="active"></button>
                                <button type="button" data-bs-target="#carruselHero" data-bs-slide-to="1"></button>
                                <button type="button" data-bs-target="#carruselHero" data-bs-slide-to="2"></button>
                                <button type="button" data-bs-target="#carruselHero" data-bs-slide-to="3"></button>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- TÍTULO SECCIÓN -->
        <div class="separador-neo"></div>


        <!-- SALA DE OBRAS — IMAGEN PANORÁMICA CON HOTSPOTS -->
        <section class="obras-sala">
            <div class="obras-sala-wrapper">
                <img src="../img/5-obras.museo-01.png" alt="Sala de obras Neoplasticismo" class="obras-sala-img" id="sala-img">

                <!-- 
                    HOTSPOTS — posiciones en % (left / top)
                    Ajustá los valores left/top según donde están
                    las obras en tu imagen 5-obras.museo-01.png
                    Los valores de ejemplo están distribuidos en la imagen.
                    Modificá data-obra="id" para que coincida con el JS.
                -->

                <!-- PINTURAS (pared izquierda/centro) -->
                <button class="obras-hotspot" style="left:38%; top:32%;" data-obra="mondrian-01" aria-label="Ver Composición con Rojo Azul y Amarillo"></button>
                <button class="obras-hotspot" style="left:24%; top:32%;" data-obra="mondrian-02" aria-label="Ver Tableau I"></button>
                <button class="obras-hotspot" style="left:50%; top:32%;" data-obra="mondrian-03" aria-label="Ver Composición II en Rojo Azul y Amarillo"></button>
                <button class="obras-hotspot" style="left:71%; top:32%;" data-obra="mondrian-04" aria-label="Ver Composición en Negro Blanco y Gris"></button>
                <button class="obras-hotspot" style="left:82%; top:32%;" data-obra="mondrian-04" aria-label="Ver Composición en Negro Blanco y Gris"></button>

                <!-- ARQUITECTURA (pared fondo) -->
                <button class="obras-hotspot" style="left:55%; top:68%;" data-obra="casa-schroder" aria-label="Ver Casa Schröder"></button>
                <button class="obras-hotspot" style="left:71%; top:66%;" data-obra="cafe-aubette" aria-label="Ver Café Aubette"></button>
                <button class="obras-hotspot" style="left:95%; top:32%;" data-obra="maison-particuliere" aria-label="Ver Maison Particulière"></button>

                <!-- DISEÑO INDUSTRIAL (pared derecha) -->
                <button class="obras-hotspot" style="left:20%; top:70%;" data-obra="silla-rietveld-01" aria-label="Ver Silla Roja y Azul"></button>

                <!-- DISEÑO GRÁFICO (sobre la mesa, inferior derecho) -->
                <button class="obras-hotspot" style="left:85%; top:71%;" data-obra="disenografico-02" aria-label="Ver Tipografía Universal"></button>
                <button class="obras-hotspot" style="left:80%; top:82%;" data-obra="disenografico-01" aria-label="Ver Revista De Stijl Portada"></button>
                <button class="obras-hotspot" style="left:94%; top:73%;" data-obra="disenografico-02" aria-label="Ver Tipografía Universal"></button>
                <button class="obras-hotspot" style="left:90%; top:85%;" data-obra="disenografico-02" aria-label="Ver Tipografía Universal"></button>


            </div>
        </section>

        <div class="separador-neo"></div>

        <!-- MODAL OBRA -->
        <div class="modal-obra" id="modal-obra">
            <div class="modal-obra-contenido">

                <!-- CERRAR -->
                <button class="modal-obra-cerrar" onclick="cerrarObra()" aria-label="Cerrar">✕</button>

                <!-- IMAGEN CARRUSEL -->
                <div class="modal-obra-carrusel">
                    <div id="carruselObra" class="carousel slide" data-bs-ride="false">
                        <div class="carousel-inner" id="carrusel-obra-inner"></div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carruselObra" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carruselObra" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        </button>
                        <div class="carousel-indicators" id="carrusel-obra-dots"></div>
                    </div>
                </div>

                <!-- FICHA -->
                <div class="modal-obra-ficha">

                    <!-- LOGO RAMA -->
                    <div class="modal-obra-rama">
                        <img src="" alt="" id="obra-rama-icono" class="modal-obra-rama-icono">
                        <span id="obra-rama-nombre" class="modal-obra-rama-texto"></span>
                    </div>

                    <h3 class="modal-obra-titulo" id="obra-titulo"></h3>
                    <p class="modal-obra-autor" id="obra-autor"></p>
                    <p class="modal-obra-anio" id="obra-anio"></p>
                    <p class="modal-obra-tecnica" id="obra-tecnica"></p>
                    <p class="modal-obra-resena" id="obra-resena"></p>

                    <a href="#" class="btn-ver-mas" id="obra-btn-mas">
                        Más información <i class="bi bi-arrow-right"></i>
                    </a>

                </div>
            </div>
        </div>

        <!-- FLECHA SCROLL TOP -->
        <a href="#top" class="scroll-to-top">
            <i class="bi bi-arrow-up-square-fill"></i>
        </a>

                        </nav>
                        <a href="https://www.instagram.com/portfolio.marianelajavierup/" target="_blank" class="footer-instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </div>
                </div>
            </div>
            <div class="footer-contacto">
                <p>© 2026 LAVORATORIO DE DISEÑO II | Neoplasticismo — Marianela Javier &nbsp;|&nbsp; marianelajavier.portfolio@gmail.com</p>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
